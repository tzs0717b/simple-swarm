<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ping</title></head>
<body style="font:13px/1.7 ui-monospace,monospace;padding:14px;color:#1a1a1a">
<p style="font-weight:600">✅ 静态页能开 = 网络通、Vite 通、JS 能跑。</p>
<div id="out" style="white-space:pre-wrap;background:#f4f4f0;padding:10px;border-radius:4px">等待检测…</div>
<p style="margin-top:14px;color:#666">下面是动态加载真正的入口模块的结果：</p>
<div id="root"></div>
<script>
var out = document.getElementById("out");
var log = [];
function say(s) { log.push(s); out.textContent = log.join("\n"); }
say("UA: " + navigator.userAgent.slice(0, 60));
window.addEventListener("error", function (e) {
  var t = e.target;
  if (t && t.tagName) say("❌ 资源/脚本失败: <" + t.tagName + "> " + (t.src || t.href || ""));
  else say("❌ error: " + ((e.error && (e.error.stack || e.error.message)) || e.message));
}, true);
window.addEventListener("unhandledrejection", function (e) {
  say("❌ rejection: " + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason));
});
setTimeout(function () { say(window.__esmRan ? "ESM <script type=module>: 执行了 ✅" : "ESM <script type=module>: 没执行 ❌"); }, 700);
setTimeout(function () {
  say("正在动态 import /src/main.tsx …");
  import("/src/main.tsx?t=" + Date.now()).then(function () {
    say("✅ main.tsx 加载并执行成功 —— 若下方出现界面，说明代码本身没问题");
  }).catch(function (e) {
    say("❌ main.tsx 加载失败：" + ((e && (e.stack || e.message)) || e));
  });
}, 900);
fetch("http://" + location.hostname + ":8787/api/swarms").then(function (r) { return r.json(); }).then(function (j) {
  say("✅ 直连 8787 /api/swarms: " + (j.swarms ? j.swarms.length + " 个集群" : "格式异常"));
}).catch(function (e) { say("❌ 直连 8787 失败: " + e.message); });
</script>
<script type="module">window.__esmRan = true;</script>
</body>
</html>
